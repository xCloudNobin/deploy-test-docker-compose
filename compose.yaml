services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "echo DB_PASSWORD=hunter2hunter2 api_note=ok; exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    environment:
      PORT: 3001
    ports:
      - "${API_PORT:-3002}:3001"
    healthcheck:
      test: ["CMD-SHELL", "echo DB_PASSWORD=hunter2hunter2 api_note=ok; exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
