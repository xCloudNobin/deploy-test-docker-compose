services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health.html"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    environment:
      PORT: 3001
    ports:
      - "${API_PORT:-3002}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "console.error('healthcheck: /health returned 503 (broken on purpose for the xcloud QA)'); process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 5
